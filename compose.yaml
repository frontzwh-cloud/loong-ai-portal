services:
  portal:
    image: loong-ai-portal:${PORTAL_RELEASE:?Use deploy.sh to select a release}
    build:
      context: .
    env_file:
      - path: ${PORTAL_CONFIG:?Use deploy.sh to select server configuration}
        format: raw
    ports:
      - "${PORTAL_BIND:-127.0.0.1}:${PORTAL_PORT:-8000}:8000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
